name: Deploy NestJS app to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - develop

env:
  APP_DIR: /home/dinil-dev/system-storage/apps/dev.school-management-api
  REMOTE_TMP_DIR: /home/ubuntu
  REMOTE_USER: ubuntu
  SERVICE_NAME: dev.school-management-api.service

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Package build folder
        run: |
          tar -czf app.tar.gz dist package.json package-lock.json

      - name: Upload tarball to EC2
        run: |
          scp -o StrictHostKeyChecking=no app.tar.gz "${REMOTE_USER}@${{ secrets.SERVER_HOST }}:${REMOTE_TMP_DIR}/app.tar.gz"

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no "${REMOTE_USER}@${{ secrets.SERVER_HOST }}" <<EOF
            set -e

            sudo mkdir -p "${APP_DIR}"
            sudo chown -R ${REMOTE_USER}:${REMOTE_USER} "${APP_DIR}"

            sudo systemctl stop "${SERVICE_NAME}" || true

            find "${APP_DIR}" -mindepth 1 -maxdepth 1 \
              ! -name '.env' \
              ! -name '.env.prod' \
              -exec rm -rf {} +

            tar -xzf "${REMOTE_TMP_DIR}/app.tar.gz" -C "${APP_DIR}"
            cd "${APP_DIR}"
            npm ci --omit=dev
            sudo systemctl start "${SERVICE_NAME}"
            sudo systemctl --no-pager --full status "${SERVICE_NAME}"

            rm -f "${REMOTE_TMP_DIR}/app.tar.gz"
            echo "Deployment complete for ${SERVICE_NAME}!"
          EOF
